# Deploy Simovis (FE + BE + DB) dalam satu PC ber-GPU.
# Struktur folder yang diharapkan:  <root>/BE_V2 (repo backend)  dan  <root>/FE (repo frontend).
# Jalankan dari folder ini:  cd BE_V2/deploy && docker compose up -d
# - network_mode: host -> BE bisa menjangkau HP DroidCam di LAN/Tailscale.
# - Semua bind 127.0.0.1 (DB, BE, FE); yang dibuka ke publik hanya FE lewat cloudflared.
# - Port & password DB di ./.env (BE_PORT, FE_PORT, DB_PORT, POSTGRES_PASSWORD).
# - JANGAN pakai `docker compose down -v`: itu menghapus volume pgdata (seluruh database).
name: simovis

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: simovis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di .env}
      POSTGRES_DB: apd_detection_v2
      TZ: Asia/Jakarta
    ports:
      - "127.0.0.1:${DB_PORT:-15432}:5432"   # hanya dari dalam PC
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simovis -d apd_detection_v2"]
      interval: 10s
      timeout: 5s
      retries: 10

  be:
    build: ..
    network_mode: host
    restart: unless-stopped
    env_file: ../.env
    environment:
      HOST: 127.0.0.1
      PORT: ${BE_PORT:-8010}
      DATABASE_URL: postgresql+psycopg://simovis:${POSTGRES_PASSWORD}@127.0.0.1:${DB_PORT:-15432}/apd_detection_v2
    volumes:
      - ../storage:/app/storage
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:${BE_PORT:-8010}/docs"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  fe:
    build: ../../FE
    network_mode: host
    restart: unless-stopped
    environment:
      API_URL: http://127.0.0.1:${BE_PORT:-8010}
      HOSTNAME: 127.0.0.1
      PORT: ${FE_PORT:-3010}
    depends_on:
      be:
        condition: service_healthy

  # Aktifkan setelah punya token dari Cloudflare Zero Trust:
  #   CF_TUNNEL_TOKEN=... docker compose --profile tunnel up -d
  # Di dashboard Cloudflare, arahkan public hostname ke http://127.0.0.1:${FE_PORT}.
  cloudflared:
    image: cloudflare/cloudflared:2025.11.1
    profiles: [tunnel]
    network_mode: host
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN:-}
    depends_on: [fe]

volumes:
  pgdata:
